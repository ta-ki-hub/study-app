<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>👑 おひめさまさんすう</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Hiragino Maru Gothic Pro', 'Rounded Mplus 1c', sans-serif; background: linear-gradient(135deg, #ffe4f0 0%, #f8d7f8 40%, #dce4ff 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .bg-stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .bg-star { position: absolute; font-size: 18px; opacity: 0.25; animation: twinkle 3s infinite alternate; }
    @keyframes twinkle { 0% { opacity: 0.1; transform: scale(0.8); } 100% { opacity: 0.35; transform: scale(1.2); } }
    .container { width: 100%; max-width: 420px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px; position: relative; z-index: 1; }
    .screen { width: 100%; display: none; flex-direction: column; align-items: center; }
    .screen.active { display: flex; }
    .start-crown { font-size: 80px; margin-bottom: 12px; animation: bounce 2s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    .start-title { font-size: 28px; font-weight: bold; color: #c0006a; text-shadow: 2px 2px 0 #ffd6ea; margin-bottom: 6px; text-align: center; }
    .start-subtitle { font-size: 15px; color: #9a4f7a; margin-bottom: 48px; text-align: center; }
    .btn-start { width: 100%; padding: 22px 16px; background: linear-gradient(135deg, #ff9ad5, #ff6bb5); border: none; border-radius: 24px; font-size: 26px; font-weight: bold; color: white; cursor: pointer; box-shadow: 0 8px 0 #d04090; transition: all 0.15s; letter-spacing: 2px; }
    .btn-start:active { transform: translateY(6px); box-shadow: 0 2px 0 #d04090; }
    .quiz-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .quiz-subject-badge { padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; color: white; background: #ff6bb5; }
    .score-area { display: flex; gap: 12px; align-items: center; }
    .score-box { background: white; border-radius: 12px; padding: 4px 12px; font-size: 14px; font-weight: bold; color: #c0006a; box-shadow: 0 2px 8px rgba(192,0,106,0.15); }
    .streak-box { background: linear-gradient(135deg, #ffd700, #ffaa00); border-radius: 12px; padding: 4px 12px; font-size: 14px; font-weight: bold; color: white; box-shadow: 0 2px 8px rgba(255,170,0,0.3); }
    .progress-bar-wrap { width: 100%; height: 10px; background: rgba(255,255,255,0.5); border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #ff6bb5, #ff9ad5); border-radius: 5px; transition: width 0.4s ease; }
    .question-card { width: 100%; background: white; border-radius: 24px; padding: 32px 20px; text-align: center; box-shadow: 0 8px 32px rgba(192,0,106,0.12); margin-bottom: 24px; min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .question-card::before { content: ''; position: absolute; top: -30px; right: -30px; width: 80px; height: 80px; background: linear-gradient(135deg, #ffe4f0, #f8d7f8); border-radius: 50%; }
    .q-num { font-size: 13px; color: #b090a0; margin-bottom: 10px; }
    .q-subject-icon { font-size: 36px; margin-bottom: 10px; }
    .q-text { font-size: 36px; font-weight: bold; color: #3a2050; letter-spacing: 3px; }
    .input-area { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .answer-input { width: 100%; padding: 20px; font-size: 32px; font-weight: bold; text-align: center; border: 4px solid #e8d0f0; border-radius: 20px; background: white; color: #3a2050; outline: none; box-shadow: 0 3px 0 #e8d0f0; transition: border-color 0.2s, box-shadow 0.2s; -webkit-appearance: none; }
    .answer-input:focus { border-color: #ff6bb5; box-shadow: 0 3px 0 #ff6bb5, 0 0 0 4px rgba(255,107,181,0.15); }
    .answer-input.correct-input { border-color: #30b050; background: linear-gradient(135deg, #f0fff4, #d4ffe0); box-shadow: 0 3px 0 #20903a; }
    .answer-input.wrong-input { border-color: #dd3333; background: linear-gradient(135deg, #fff0f0, #ffe0e0); box-shadow: 0 3px 0 #bb2222; }
    .btn-answer { width: 100%; padding: 18px; background: linear-gradient(135deg, #b87fff, #9955ff); border: none; border-radius: 18px; font-size: 22px; font-weight: bold; color: white; cursor: pointer; box-shadow: 0 6px 0 #6633cc; transition: all 0.15s; }
    .btn-answer:active { transform: translateY(4px); box-shadow: 0 2px 0 #6633cc; }
    .btn-answer:disabled { opacity: 0.5; pointer-events: none; }
    .feedback { margin-top: 4px; padding: 14px 20px; border-radius: 16px; font-size: 18px; font-weight: bold; text-align: center; width: 100%; display: none; }
    .feedback.correct-fb { background: linear-gradient(135deg, #d4ffe0, #a0f0b0); color: #1a8030; border: 2px solid #70d080; }
    .feedback.wrong-fb { background: linear-gradient(135deg, #ffe0e0, #ffc0c0); color: #c02020; border: 2px solid #ff9090; }
    .firework { position: fixed; pointer-events: none; z-index: 100; }
    .result-crown { font-size: 80px; margin-bottom: 8px; animation: bounce 1.5s infinite; }
    .result-title { font-size: 26px; font-weight: bold; color: #c0006a; text-align: center; margin-bottom: 4px; }
    .result-score-card { background: white; border-radius: 24px; padding: 24px 32px; text-align: center; box-shadow: 0 8px 32px rgba(192,0,106,0.15); margin: 20px 0; width: 100%; }
    .result-score-num { font-size: 64px; font-weight: bold; color: #c0006a; line-height: 1; }
    .result-score-label { font-size: 18px; color: #9a6a8a; margin-top: 4px; }
    .result-msg { font-size: 18px; color: #7a4a6a; text-align: center; margin-bottom: 24px; line-height: 1.6; }
    .result-stars { font-size: 36px; letter-spacing: 4px; margin-bottom: 8px; }
    .result-btns { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .btn-retry { width: 100%; padding: 16px; background: linear-gradient(135deg, #ff9ad5, #ff6bb5); border: none; border-radius: 16px; font-size: 18px; font-weight: bold; color: white; cursor: pointer; box-shadow: 0 5px 0 #d04090; transition: all 0.15s; }
    .btn-retry:active { transform: translateY(4px); box-shadow: 0 1px 0 #d04090; }
    .btn-home { width: 100%; padding: 14px; background: white; border: 3px solid #e0c0d0; border-radius: 16px; font-size: 16px; font-weight: bold; color: #9a6a8a; cursor: pointer; transition: all 0.15s; }
    .btn-home:active { background: #f8eaf4; }
  </style>
</head>
<body>
<div class="bg-stars" id="bgStars"></div>
<div class="container">
  <div class="screen active" id="screenStart">
    <div class="start-crown">👑</div>
    <div class="start-title">おひめさまさんすう</div>
    <div class="start-subtitle">✨ こたえをじぶんでうちこもう ✨</div>
    <button class="btn-start" onclick="startQuiz()">🔢 はじめる！</button>
  </div>
  <div class="screen" id="screenQuiz">
    <div class="quiz-header">
      <div class="quiz-subject-badge">さんすう 🔢</div>
      <div class="score-area">
        <div class="score-box" id="scoreBox">⭐ 0</div>
        <div class="streak-box" id="streakBox">🔥 0</div>
      </div>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <div class="question-card">
      <div class="q-num" id="qNum">もんだい 1 / 10</div>
      <div class="q-subject-icon">🔢</div>
      <div class="q-text" id="qText">　</div>
    </div>
    <div class="input-area">
      <input class="answer-input" id="answerInput" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="こたえをいれてね" autocomplete="off" />
      <button class="btn-answer" id="btnAnswer" onclick="submitAnswer()">✅ こたえる</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="screen" id="screenResult">
    <div class="result-crown">👑</div>
    <div class="result-stars" id="resultStars">⭐⭐⭐⭐⭐</div>
    <div class="result-title" id="resultTitle">すごい！パーフェクト！</div>
    <div class="result-score-card">
      <div class="result-score-num" id="resultNum">10</div>
      <div class="result-score-label" id="resultLabel">10もん せいかい！</div>
    </div>
    <div class="result-msg" id="resultMsg">おひめさまにんていしょうをあげます！✨</div>
    <div class="result-btns">
      <button class="btn-retry" onclick="startQuiz()">🔄 もういちどやる</button>
      <button class="btn-home" onclick="goHome()">🏠 はじめにもどる</button>
    </div>
  </div>
</div>
<script>
const questions=[{q:'38 ＋ 47',a:85},{q:'62 ＋ 29',a:91},{q:'75 ー 38',a:37},{q:'93 ー 56',a:37},{q:'6 × 7',a:42},{q:'8 × 9',a:72},{q:'7 × 6',a:42},{q:'9 × 4',a:36},{q:'54 ＋ 37',a:91},{q:'80 ー 43',a:37},{q:'3 × 8',a:24},{q:'5 × 9',a:45},{q:'67 ＋ 24',a:91},{q:'100 ー 64',a:36},{q:'4 × 7',a:28},{q:'25 ＋ 58',a:83},{q:'71 ー 29',a:42},{q:'3 × 6',a:18},{q:'7 × 8',a:56},{q:'48 ＋ 35',a:83}];
let currentQuestions=[],currentIndex=0,score=0,streak=0,answered=false;
const totalQuestions=10;
function initBgStars(){const c=document.getElementById('bgStars'),icons=['✨','⭐','💫','🌟','✦'];for(let i=0;i<20;i++){const s=document.createElement('div');s.className='bg-star';s.textContent=icons[Math.floor(Math.random()*icons.length)];s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';s.style.animationDuration=(2.5+Math.random()*2)+'s';c.appendChild(s);}}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function startQuiz(){currentQuestions=shuffle(questions).slice(0,totalQuestions);currentIndex=0;score=0;streak=0;answered=false;showScreen('screenQuiz');showQuestion();}
function showQuestion(){answered=false;const q=currentQuestions[currentIndex];const total=currentQuestions.length;document.getElementById('qNum').textContent='もんだい '+(currentIndex+1)+' / '+total;document.getElementById('qText').textContent=q.q;document.getElementById('scoreBox').textContent='⭐ '+score;document.getElementById('streakBox').textContent='🔥 '+streak;document.getElementById('progressBar').style.width=(currentIndex/total*100)+'%';document.getElementById('feedback').style.display='none';const input=document.getElementById('answerInput');input.value='';input.className='answer-input';input.disabled=false;document.getElementById('btnAnswer').disabled=false;setTimeout(()=>input.focus(),300);}
function submitAnswer(){if(answered)return;const input=document.getElementById('answerInput');const val=input.value.trim();if(val==='')return;answered=true;input.disabled=true;document.getElementById('btnAnswer').disabled=true;const correct=currentQuestions[currentIndex].a;const isCorrect=parseInt(val,10)===correct;const feedback=document.getElementById('feedback');if(isCorrect){score++;streak++;input.className='answer-input correct-input';feedback.textContent='🎉 せいかい！'+(streak>=3?' 🔥'+streak+'れんぞく！':'');feedback.className='feedback correct-fb';launchFireworks();}else{streak=0;input.className='answer-input wrong-input';feedback.textContent='💦 ざんねん…こたえは「'+correct+'」だよ';feedback.className='feedback wrong-fb';}feedback.style.display='block';document.getElementById('scoreBox').textContent='⭐ '+score;document.getElementById('streakBox').textContent='🔥 '+streak;setTimeout(nextQuestion,2000);}
function nextQuestion(){currentIndex++;if(currentIndex>=currentQuestions.length){showResult();}else{showQuestion();}}
function launchFireworks(){const emojis=['✨','🌟','💫','⭐','🎉','🎊','💖','👑'];for(let i=0;i<6;i++){setTimeout(()=>{const fw=document.createElement('div');fw.className='firework';fw.textContent=emojis[Math.floor(Math.random()*emojis.length)];fw.style.left=(10+Math.random()*80)+'%';fw.style.top=(5+Math.random()*60)+'%';fw.style.fontSize=(24+Math.random()*20)+'px';document.body.appendChild(fw);fw.animate([{opacity:1,transform:'scale(0.5) translateY(0)'},{opacity:0,transform:'scale(1.5) translateY(-'+(40+Math.random()*60)+'px)'}],{duration:800,easing:'ease-out'}).onfinish=()=>fw.remove();},i*100);}}
function showResult(){const total=currentQuestions.length;const pct=score/total;document.getElementById('resultNum').textContent=score;document.getElementById('resultLabel').textContent=total+'もん せいかい！';document.getElementById('progressBar').style.width='100%';let stars,title,msg;if(pct===1){stars='⭐⭐⭐⭐⭐';title='すごい！パーフェクト！✨';msg='ぜんもんせいかい！おひめさまにんていしょうをあげます！💖';}else if(pct>=0.8){stars='⭐⭐⭐⭐';title='とってもじょうず！';msg='もうすこしでパーフェクト！つぎはできるよ💪';}else if(pct>=0.6){stars='⭐⭐⭐';title='よくできました！';msg='まちがえたところをまたれんしゅうしてみよう！📚';}else if(pct>=0.4){stars='⭐⭐';title='がんばった！';msg='もう一かいやってみるともっとできるようになるよ！✊';}else{stars='⭐';title='チャレンジよくできました！';msg='むずかしくてもあきらめないでね！💪';}document.getElementById('resultStars').textContent=stars;document.getElementById('resultTitle').textContent=title;document.getElementById('resultMsg').textContent=msg;showScreen('screenResult');if(pct>=0.8){for(let i=0;i<5;i++)setTimeout(launchFireworks,i*400);}}
function goHome(){showScreen('screenStart');}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!answered)submitAnswer();});
initBgStars();
</script>
</body>
</html>
